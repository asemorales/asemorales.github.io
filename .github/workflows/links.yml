name: Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: links

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --max-retries 2 --accept 100..=103,200..=299,403,429 src/content/notes
          format: json
          output: lychee.json
          fail: false
      - name: Update link status
        run: node scripts/link-status.js lychee.json
      - name: Refresh popover cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-cards.js --refresh

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet src/data && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update link status and cards" src/data
          git push
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
