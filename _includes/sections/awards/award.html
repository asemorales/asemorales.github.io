<div class="group flex flex-col items-center justify-start h-full w-full rounded-md border border-base-200 bg-base-100 p-12 transition-colors duration-200 hover:border-base-300">
  
  <div class="h-24 w-full flex items-center justify-center">
    <span class="sr-only">{{ award.icon-label }}</span>
    {% include {{ award.svg | prepend: "svg/awards/" | append: ".svg" }} classes="h-full w-auto fill-neutral-200 group-hover:fill-award-icon transition-colors duration-200" %}
  </div>

  <div class="text-center">
    <h3 class="text-base font-semibold leading-relaxed text-white">
      {{ award.name }}
    </h3>
    <span class="block mb-2">
      <span class="sr-only">of </span>
      <a href="{{ award.url }}"
         target="_blank"
         rel="noopener noreferrer"
         class="group/name text-pretty hover:underline underline-offset-4">
        {{ award.competition }}<i aria-hidden="true" class="ps-1 ri-arrow-right-up-line font-medium inline-block -translate-x-0.5 transition-transform ease-in-out group-hover/name:-translate-y-0.5 group-hover/name:translate-x-0.5 motion-reduce:transition-none"></i>
        <span class="sr-only"> (Opens in a new tab)</span>
      </a>
    </span>

    <p class="text-sm leading-relaxed text-neutral-200 text-pretty">
      {{ award.description }}
    </p>

  </div>
</div>
