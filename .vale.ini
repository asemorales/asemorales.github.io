StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, frontmatter
Packages = proselint

[formats]
mjs = js
cjs = js

# Code files are linted only in their comments.
[*.{js,mjs,cjs,ts,css}]
asemorales.NotContrast = YES

[*.md]
BasedOnStyles = Vale, proselint, asemorales

# $ pairs follow Obsidian: no space inside, so "$5 and $10" stays prose.
TokenIgnores = (\$(?=\S)[^\n$]*(?<=\S)\$), (!?\[\[[^\]|]+\|?), (\]\]), (\[\^[^\]]+\]), (\[![\w-]+\][+-]?), (https?://[^\s)>\]]+)
BlockIgnores = (?s)(\$\$.*?\$\$), (?m)(^[ \t]*(?:\[\^[^\]]+\]:[ \t]*)?> \[!(?:quote|epigraph)\].*(?:\n[ \t]*>.*)*)

Vale.Repetition = warning
Vale.Spelling = NO

# Conflicts with the voice this site is written in.
proselint.Apologizing = NO
proselint.But = NO
proselint.Cursing = NO
proselint.Hedging = NO
proselint.Archaisms = NO
proselint.CorporateSpeak = NO
proselint.Skunked = NO

# Duplicates another rule.
proselint.Uncomparables = NO
proselint.Very = NO
proselint.Needless = NO

# False alarms: "cafe", "naive", and list markers such as "(c)".
proselint.Diacritical = NO
proselint.Typography = NO

proselint.Airlinese = suggestion
proselint.AnimalLabels = suggestion
proselint.Annotations = suggestion
proselint.Cliches = suggestion
proselint.Currency = suggestion
proselint.DateCase = suggestion
proselint.DateMidnight = suggestion
proselint.DateRedundancy = suggestion
proselint.DateSpacing = suggestion
proselint.DenizenLabels = suggestion
proselint.GenderBias = suggestion
proselint.GroupTerms = suggestion
proselint.Hyperbole = suggestion
proselint.Jargon = suggestion
proselint.LGBTOffensive = suggestion
proselint.LGBTTerms = suggestion
proselint.Malapropisms = suggestion
proselint.Nonwords = suggestion
proselint.Oxymorons = suggestion
proselint.P-Value = suggestion
proselint.RASSyndrome = suggestion
proselint.Spelling = suggestion
