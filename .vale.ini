StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft

[formats]
mjs = js
cjs = js

# Code files are linted only in their comments.
[*.{md,js,mjs,cjs,ts,css}]
BasedOnStyles = asemorales

# Microsoft rules adapted from CodeQL's docs config:
# https://github.com/github/codeql/blob/fd2bfc8a3da9c73a0c8be05d110efaf14a856445/docs/codeql/.vale.ini
Microsoft.DateFormat = YES
Microsoft.DateNumbers = YES
Microsoft.DateOrder = YES
Microsoft.Foreign = YES
Microsoft.Gender = YES
Microsoft.OxfordComma = error
Microsoft.Quotes = YES
Microsoft.SentenceLength = YES
Microsoft.URLFormat = YES
Microsoft.Wordiness = suggestion

[*.md]
TokenIgnores = (\$[^\n$]+\$), (\[\[[^\]]+\]\]), (\[\^[^\]]+\])
BlockIgnores = (?s)(\$\$.*?\$\$)
